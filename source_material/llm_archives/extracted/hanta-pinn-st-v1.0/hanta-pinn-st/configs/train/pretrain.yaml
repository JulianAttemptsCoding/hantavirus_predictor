training:
  batch_size: 32
  max_epochs: 500
  optimizer: "AdamW"
  lr: 1e-3
  weight_decay: 1e-4
  scheduler: "cosine"
  warmup_epochs: 10
  gradient_clip: 1.0
  mixed_precision: true

  loss_weights:
    data: 1.0
    ode: 0.1
    sde: 0.01
    spill: 1.0
    bound: 0.1
    reg: 1e-4

  early_stopping:
    patience: 30
    monitor: "val_wis"
    mode: "min"

  checkpointing:
    save_top_k: 3
    monitor: "val_wis"
    mode: "min"
    filename: "hanta-pinn-st-{epoch:02d}-{val_wis:.4f}"

data:
  spatial_resolution: 0.1  # degrees (~10km)
  temporal_resolution: "weekly"
  lag_months: [6, 12, 18, 24]

  synthetic:
    n_trajectories: 50000
    t_max: 730
    seed: 42

  transfer:
    source_diseases: ["dengue", "leptospirosis", "lyme"]
    pretrain_epochs: 100
    freeze_ratio: 0.9

  train_years: [1993, 2018]
  val_years: [2019, 2021]
  test_years: [2022, 2023]
