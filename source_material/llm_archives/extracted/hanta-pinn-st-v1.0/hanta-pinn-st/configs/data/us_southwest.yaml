data:
  region: "us_southwest"
  bbox: [-125.0, 25.0, -100.0, 42.0]

  sources:
    human_cases:
      provider: "cdc"
      url: "https://wonder.cdc.gov/nndss.html"
      format: "csv"
      update_freq: "weekly"

    rodent_surveillance:
      provider: "neon"
      url: "https://data.neonscience.org/data-api/"
      format: "csv"
      update_freq: "monthly"
      sites: ["ABBY", "BARR", "BART", "BLAN", "BONA", "CLBJ"]

    climate:
      provider: "era5"
      url: "https://cds.climate.copernicus.eu/"
      variables: ["2m_temperature", "total_precipitation", "relative_humidity"]
      resolution: "0.25deg"

    vegetation:
      provider: "modis"
      product: "MOD13Q1"
      variables: ["NDVI", "EVI"]
      resolution: "250m"
      temporal: "16-day"

    socioeconomic:
      provider: "cdc_svi"
      url: "https://www.atsdr.cdc.gov/placeandhealth/svi/"
      year: 2020

  features:
    lag_windows: [6, 12, 18, 24]
    anomaly_baseline: [1991, 2020]

    engineered:
      - name: "carrying_capacity_proxy"
        formula: "ndvi_anom * precip_anom * exp(-abs(temp_anom))"
      - name: "human_exposure_index"
        formula: "0.3*svi + 0.2*rural_pct + 0.2*housing_age/100 + 0.3*(1-exp(-road_density/10))"
