version: '3.8'

services:
  hanta-training:
    build:
      context: .
      dockerfile: Dockerfile
    image: hantavirus-predictor:latest
    container_name: hanta-train
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0,1,2,3
      - WANDB_PROJECT=hantavirus-predictor
      - WANDB_API_KEY=${WANDB_API_KEY}
      - PYTHONHASHSEED=42
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./config:/app/config
    shm_size: '16gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      python scripts/train.py 
      --config config/train_config.yaml 
      --gpus 4 
      --precision 16
    networks:
      - hanta-net

  hanta-inference:
    build:
      context: .
      dockerfile: Dockerfile
    image: hantavirus-predictor:latest
    container_name: hanta-inference
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - MODEL_PATH=/app/outputs/checkpoints/hantast_pinn_fm_final.ckpt
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    ports:
      - "8000:8000"
    command: >
      python scripts/deploy.py 
      --model_path /app/outputs/checkpoints/hantast_pinn_fm_final.ckpt 
      --port 8000
    networks:
      - hanta-net

  hanta-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: hantavirus-predictor:latest
    container_name: hanta-dashboard
    environment:
      - API_URL=http://hanta-inference:8000
    ports:
      - "8501:8501"
    command: >
      streamlit run scripts/dashboard.py 
      --server.port 8501 
      --server.address 0.0.0.0
    networks:
      - hanta-net
    depends_on:
      - hanta-inference

networks:
  hanta-net:
    driver: bridge
