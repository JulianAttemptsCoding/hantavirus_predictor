# Data configuration
data_sources:
  neon_serology: DP1.10064.001
  neon_captures: DP1.10072.001
  modis_ndvi: MOD13Q1
  era5: reanalysis-era5-land
  chirps: daily
  cdc_cases: NNDSS
  cdc_svi: ATSDR

spatial:
  grid_size_km: 10
  crs: EPSG:5070  # Albers Equal Area

temporal:
  train_years: [2014, 2015, 2016, 2017]
  val_years: [2018]
  test_years: [2019]

lags:
  climate_to_rodent: [6, 12, 18, 24]  # months
  rodent_to_human: [2, 4, 8]  # weeks

features:
  env_history: [ndvi, precip, temp, enso]
  human_features: [svi, housing_age, rural_frac, season_sin, season_cos]
