[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hantavirus-predictor"
version = "0.1.0"
description = "Reproducible EU/EEA country-year benchmark for reported hantavirus incidence and public-surveillance forecasting limits."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "JulianAttemptsCoding" }
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.10"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5"
]
geo = [
  "geopandas>=0.14",
  "rasterio>=1.3",
  "shapely>=2.0",
  "xarray>=2024.1",
  "netCDF4>=1.6"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
