name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,geo]"
      - name: Test
        run: python -m pytest
      - name: Lint
        run: python -m ruff check src tests tools
      - name: DOCX artifacts
        run: python tools/check_docx_artifacts.py
      - name: EID readiness
        run: python tools/check_eid_submission_readiness.py --strict
