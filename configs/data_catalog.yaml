project_scope:
  active_target: "Emerging Infectious Diseases Research article"
  geography: "European Union and European Economic Area"
  unit: "country-year"
  years: [2019, 2020, 2021, 2022, 2023]
  outcome: "reported annual hantavirus cases and reported incidence"

sources:
  ecdc_hantavirus_surveillance:
    url: "https://www.ecdc.europa.eu/en/publications-data/hantavirus-infection-annual-epidemiological-report-2023"
    auth: "none"
    role: "primary country-year reported-case outcome"
    key_metadata:
      report_publication_date: "2025-03-07"
      tessy_retrieval_date: "2024-11-06"
      reported_2023_cases: 1885
      reporting_countries_2023: 28
      finland_germany_case_share_2023_percent: 60.5
    qa:
      - "Reconcile annual totals for 2019-2023."
      - "Flag Belgium 2023 as not comprehensive."
      - "Flag Cyprus 2023 as unspecified."
      - "Exclude UK rows from the primary panel."

  world_bank_indicators:
    url: "https://data.worldbank.org"
    auth: "none"
    indicators:
      - "SP.POP.TOTL"
      - "SP.RUR.TOTL.ZS"
      - "NY.GDP.PCAP.PP.KD"
    role: "population denominator and demographic/economic context"

  faostat_land_use:
    url: "https://www.fao.org/faostat/en/#data/RL"
    auth: "none"
    role: "country-year land-use covariates"

  terraclimate:
    url: "https://www.climatologylab.org/terraclimate.html"
    auth: "none"
    role: "country-year climate and water-balance covariates"
    variables:
      - "temperature"
      - "precipitation"
      - "maximum temperature"
      - "minimum temperature"
      - "soil moisture"
      - "Palmer Drought Severity Index"

  natural_earth:
    url: "https://www.naturalearthdata.com"
    auth: "none"
    role: "country boundaries for aggregation and maps"

  modis_mod13c2:
    url: "https://lpdaac.usgs.gov/products/mod13c2v061/"
    auth: "NASA Earthdata account"
    role: "candidate vegetation covariates only"
    status: "excluded from primary claims until quality-masked aggregation passes inclusion gate"

data_policy:
  tracked:
    - "source code"
    - "tests"
    - "schemas"
    - "configs"
    - "documentation"
    - "EID manuscript and final submission artifacts"
  ignored:
    - "raw downloads"
    - "processed data"
    - "generated reports"
    - "credentials"
    - "ad hoc ZIP archives"
