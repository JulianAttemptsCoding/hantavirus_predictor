project:
  active_target: "Emerging Infectious Diseases Research article"
  scope: "EU/EEA country-year reported hantavirus incidence, 2019-2023"
  design: "retrospective one-year-ahead probabilistic benchmark"

model_sequence:
  surveillance_baselines:
    - name: "country_historical_mean_rate"
      purpose: "minimum country-specific surveillance-history comparator"
    - name: "last_observed_country_rate"
      purpose: "persistence baseline for recent reported incidence"
    - name: "empirical_negative_binomial_rate"
      purpose: "conservative uncertainty reference"
    - name: "hierarchical_negative_binomial_rate"
      purpose: "shrinkage reference for sparse country histories"
  covariate_blocks:
    - name: "surveillance_only"
      purpose: "lagged and panel surveillance summaries"
    - name: "context"
      purpose: "World Bank demographic and socioeconomic context"
    - name: "land_use"
      purpose: "FAOSTAT land-use context"
    - name: "climate"
      purpose: "TerraClimate lagged climate and water-balance context"
    - name: "all_public"
      purpose: "all public covariates plus source-quality metadata"
  exploratory_count_model:
    - name: "penalized_poisson_glm"
      purpose: "count-scale sensitivity with population offset; do not interpret coefficients causally"

promotion_rule:
  required:
    - "2023 WIS improves by at least 5 percent over the best simple surveillance baseline, or WIS is comparable and coverage is materially closer to 0.90."
    - "2023 90 percent coverage is not lower than the best simple baseline by more than 5 percentage points."
    - "Mean interval width is interpretable and not merely inflated."
    - "No target-year outcome information is used in imputation, screening, tuning, or features."
    - "Result survives flagged-row sensitivity."
    - "Result is not driven solely by Finland or Germany."
    - "No causal claim is made from model coefficients."

blocked_claims:
  - "operational public-health predictor"
  - "clinical decision tool"
  - "within-country risk map"
  - "prospective forecast"
  - "causal climate effect"
  - "true infection burden"
  - "human infection predictor without matching human surveillance validation"

eid_missing_gates:
  - "model-input Table 1 with ranges, sources, lags, and missingness"
  - "model/workflow schematic"
  - "surveillance-quality sensitivity"
  - "leave-one-country-out influence"
  - "calibration localization"
  - "null-calibrated detectability screen"
  - "strict EID readiness checker"
